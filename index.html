<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Cámaras</title>
    <link rel="icon" type="image/png" href="camara.png">
    
    <style>
        body {
            background: #000000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Contenedor Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px; 
            align-items: start;
        }

        /* Caja de cámara */
        .cam-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        /* Videos */
        iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.15);
            background-color: #111;
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- AQUÍ SE CARGA EL ARCHIVO EXTERNO DE CONFIGURACIÓN -->
    <script src="config.js"></script>

</head>
<body>

    <h1>Monitoreo de Cámaras</h1>

    <!-- Contenedor vacío donde se generarán las cámaras -->
    <div id="camera-container" class="grid-container"></div>

    <script>
        // Función inteligente para sacar el ID de cualquier link de YouTube
        function extraerIdYoutube(url) {
            if (url.length === 11 && !url.includes('/')) return url;
            const regex = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const coincidencia = url.match(regex);
            return (coincidencia && coincidencia[2].length === 11) ? coincidencia[2] : url;
        }

        // Función que lee config.js y dibuja la página
        function cargarCamaras() {
            const contenedor = document.getElementById('camera-container');
            
            // camarasConfig viene directamente del archivo config.js
            camarasConfig.forEach(cam => {
                let htmlIframe = '';
                
                if (cam.tipo === 'youtube') {
                    const videoId = extraerIdYoutube(cam.enlace);
                    htmlIframe = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&controls=0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    htmlIframe = `<iframe src="${cam.enlace}" scrolling="no" allowfullscreen="true"></iframe>`;
                }

                const caja = document.createElement('div');
                caja.className = 'cam-box';
                caja.innerHTML = `
                    <span>${cam.nombre}</span>
                    ${htmlIframe}
                `;
                contenedor.appendChild(caja);
            });
        }

        // Cargar todo al abrir la página
        window.onload = cargarCamaras;
    </script>
</body>
</html>
