<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Cámaras</title>
    <link rel="icon" type="image/png" href="camara.png">
    
    <style>
        body {
            background: #000000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px; 
            align-items: start;
        }

        .cam-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.15);
            background-color: #111;
        }

        /* Estilos para el pie de página y el botón de caché */
        .footer-controls {
            text-align: center;
            margin-top: 50px;
            margin-bottom: 20px;
            padding-top: 20px;
            border-top: 1px solid #333; /* Una línea sutil para separar los videos del botón */
        }

        .btn-reload {
            background-color: #d93025;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .btn-reload:hover { 
            background-color: #b3261d; 
        }

        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Enlace al archivo de configuración -->
    <script src="config.js"></script>

</head>
<body>

    <h1>Monitoreo de Cámaras</h1>

    <div id="camera-container" class="grid-container"></div>

    <!-- Pie de página con el botón -->
    <div class="footer-controls">
        <button class="btn-reload" onclick="borrarCacheYRecargar()">🗑️ Borrar caché y Recargar</button>
    </div>

    <script>
        function extraerIdYoutube(url) {
            if (url.length === 11 && !url.includes('/')) return url;
            const regex = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=|live\/)([^#\&\?]*).*/;
            const coincidencia = url.match(regex);
            return (coincidencia && coincidencia[2].length === 11) ? coincidencia[2] : url;
        }

        function cargarCamaras() {
            const contenedor = document.getElementById('camera-container');
            
            camarasConfig.forEach(cam => {
                let htmlIframe = '';
                
                if (cam.tipo === 'youtube') {
                    const videoId = extraerIdYoutube(cam.enlace);
                    htmlIframe = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&playsinline=1&controls=0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    htmlIframe = `<iframe src="${cam.enlace}" scrolling="no" allowfullscreen="true"></iframe>`;
                }

                const caja = document.createElement('div');
                caja.className = 'cam-box';
                caja.innerHTML = `
                    <span>${cam.nombre}</span>
                    ${htmlIframe}
                `;
                contenedor.appendChild(caja);
            });
        }

        // Función para forzar la recarga saltándose la caché
        function borrarCacheYRecargar() {
            // Añade un parámetro único (la hora exacta) a la URL para obligar al navegador a descargar todo de nuevo
            const urlSinParametros = window.location.href.split('?')[0];
            window.location.href = urlSinParametros + '?nocache=' + new Date().getTime();
        }

        window.onload = cargarCamaras;
    </script>
</body>
</html>
