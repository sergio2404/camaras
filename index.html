<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>Cámaras</title>
    <link rel="icon" type="image/png" href="camara.png">
    
    <style>
        body {
            background: #000000;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
        }

        /* Contenedor Grid */
        .grid-container {
            display: grid;
            /* Crea columnas automáticas que no midan menos de 400px ni más de 1 fracción del espacio libre */
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px; 
            align-items: start;
        }

        /* Caja individual de cada cámara */
        .cam-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        /* Asegura que los videos mantengan su proporción sin importar el dispositivo */
        iframe {
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.15);
            background-color: #111; /* Fondo oscuro mientras carga */
        }

        /* Ajuste extra para móviles pequeños */
        @media (max-width: 480px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
